<script>

let image = new Image();

const fileInput = document.getElementById("fileInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

fileInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (e) {

        image.onload = function () {

            canvas.width = image.width;
            canvas.height = image.height;

            ctx.drawImage(image, 0, 0);

            status.innerText =
                "ID Card Image Loaded";

        };

        image.src = e.target.result;
    };

    reader.readAsDataURL(file);
});


function processImage() {

    if (!image.src) {
        alert("Please select ID Card image first.");
        return;
    }

    status.innerText =
        "Detecting ID Card...";

    canvas.width = image.width;
    canvas.height = image.height;

    ctx.drawImage(image, 0, 0);

    setTimeout(() => {

        autoCrop();

    }, 300);
}


function autoCrop() {

    const sourceCanvas =
        document.createElement("canvas");

    const sourceCtx =
        sourceCanvas.getContext("2d");

    sourceCanvas.width =
        image.width;

    sourceCanvas.height =
        image.height;

    sourceCtx.drawImage(
        image,
        0,
        0
    );

    const img =
        sourceCtx.getImageData(
            0,
            0,
            sourceCanvas.width,
            sourceCanvas.height
        );

    const data = img.data;

    let minX = sourceCanvas.width;
    let minY = sourceCanvas.height;

    let maxX = 0;
    let maxY = 0;

    const threshold = 45;

    for (
        let y = 0;
        y < sourceCanvas.height;
        y += 4
    ) {

        for (
            let x = 0;
            x < sourceCanvas.width;
            x += 4
        ) {

            const index =
                (y * sourceCanvas.width + x) * 4;

            const r = data[index];
            const g = data[index + 1];
            const b = data[index + 2];

            const brightness =
                (r + g + b) / 3;

            if (brightness > threshold) {

                if (x < minX)
                    minX = x;

                if (y < minY)
                    minY = y;

                if (x > maxX)
                    maxX = x;

                if (y > maxY)
                    maxY = y;
            }
        }
    }

    if (
        minX >= maxX ||
        minY >= maxY
    ) {

        status.innerText =
            "Auto Crop Failed";

        ctx.drawImage(
            image,
            0,
            0
        );

        return;
    }

    const margin = 10;

    minX =
        Math.max(
            0,
            minX - margin
        );

    minY =
        Math.max(
            0,
            minY - margin
        );

    maxX =
        Math.min(
            image.width,
            maxX + margin
        );

    maxY =
        Math.min(
            image.height,
            maxY + margin
        );

    const cropWidth =
        maxX - minX;

    const cropHeight =
        maxY - minY;

    const croppedCanvas =
        document.createElement("canvas");

    croppedCanvas.width =
        cropWidth;

    croppedCanvas.height =
        cropHeight;

    const croppedCtx =
        croppedCanvas.getContext("2d");

    croppedCtx.drawImage(
        image,

        minX,
        minY,
        cropWidth,
        cropHeight,

        0,
        0,
        cropWidth,
        cropHeight
    );

    canvas.width =
        cropWidth;

    canvas.height =
        cropHeight;

    ctx.drawImage(
        croppedCanvas,
        0,
        0
    );

    status.innerText =
        "✓ ID Card Auto Cropped Successfully";
}


function enhanceImage() {

    if (canvas.width === 0) {

        alert(
            "Please select an ID Card first."
        );

        return;
    }

    const imgData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const data =
        imgData.data;

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        data[i] =
            Math.min(
                255,
                data[i] * 1.10
            );

        data[i + 1] =
            Math.min(
                255,
                data[i + 1] * 1.10
            );

        data[i + 2] =
            Math.min(
                255,
                data[i + 2] * 1.10
            );
    }

    ctx.putImageData(
        imgData,
        0,
        0
    );

    status.innerText =
        "✓ Image Enhanced";
}


function saveImage() {

    if (canvas.width === 0) {

        alert(
            "Please process an image first."
        );

        return;
    }

    const link =
        document.createElement("a");

    link.download =
        "ID-Card-Enhanced.jpg";

    link.href =
        canvas.toDataURL(
            "image/jpeg",
            0.95
        );

    link.click();

    status.innerText =
        "✓ ID Card Saved";
}

</script>
