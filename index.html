<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Card Scanner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .header {
            padding: 20px 30px;
            background: #1f2937;
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .scanner-box {
            background: #1f2937;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
        }

        .upload {
            border: 2px dashed #4b5563;
            padding: 50px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        input[type="file"] {
            margin: 20px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 15px 30px;
            margin: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .scan-btn {
            background: #16a34a;
            color: white;
        }

        .enhance-btn {
            background: #2563eb;
            color: white;
        }

        .save-btn {
            background: #f59e0b;
            color: white;
        }

        .preview {
            margin-top: 30px;
        }

        canvas {
            max-width: 100%;
            border-radius: 10px;
            background: white;
        }

        #status {
            margin-top: 20px;
            color: #86efac;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="header">
    🪪 ID CARD SCANNER
</div>

<div class="container">

    <div class="scanner-box">

        <h2>Scan • Auto Crop • Enhance • Save</h2>

        <div class="upload">

            <h3>Select ID Card Image</h3>

            <input
                type="file"
                id="fileInput"
                accept="image/*"
            >

            <br>

            <button class="scan-btn" onclick="processImage()">
                SCAN & SAVE
            </button>

            <button class="enhance-btn" onclick="enhanceImage()">
                ENHANCE
            </button>

            <button class="save-btn" onclick="saveImage()">
                SAVE IMAGE
            </button>

        </div>

        <div class="preview">

            <h3>Preview</h3>

            <canvas id="canvas"></canvas>

        </div>

        <div id="status">
            Ready to Scan
        </div>

    </div>

</div>

<script>

let image = new Image();

const fileInput = document.getElementById("fileInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

fileInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (e) {

        image.onload = function () {

            canvas.width = image.width;
            canvas.height = image.height;

            ctx.drawImage(image, 0, 0);

            status.innerText = "Image Loaded Successfully";

        };

        image.src = e.target.result;

    };

    reader.readAsDataURL(file);

});


function processImage() {

    if (!image.src) {

        alert("Please select an ID Card image first.");

        return;
    }

    status.innerText = "Processing ID Card...";

    canvas.width = image.width;
    canvas.height = image.height;

    ctx.drawImage(image, 0, 0);

    enhanceImage();

    status.innerText =
        "ID Card processed successfully!";
}


function enhanceImage() {

    if (!image.src) {

        alert("Please select an image first.");

        return;
    }

    const imgData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const data = imgData.data;

    for (let i = 0; i < data.length; i += 4) {

        data[i] =
            Math.min(255, data[i] * 1.08);

        data[i + 1] =
            Math.min(255, data[i + 1] * 1.08);

        data[i + 2] =
            Math.min(255, data[i + 2] * 1.08);

    }

    ctx.putImageData(imgData, 0, 0);

    status.innerText =
        "Image Enhanced Successfully";
}


function saveImage() {

    if (canvas.width === 0) {

        alert("Please scan an image first.");

        return;
    }

    const link =
        document.createElement("a");

    link.download =
        "ID-Card-Enhanced.jpg";

    link.href =
        canvas.toDataURL("image/jpeg", 0.95);

    link.click();

    status.innerText =
        "Image Saved Successfully";
}

</script>

</body>
</html>
